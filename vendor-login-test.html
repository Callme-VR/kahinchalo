<!DOCTYPE html>
<html>
<head>
    <title>Vendor Login Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { color: green; }
        .error { color: red; }
        button { padding: 10px 20px; margin: 5px; }
        input { padding: 5px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Vendor Login Functionality Test</h1>
    
    <div class="test-section">
        <h2>1. Vendor Login Form</h2>
        <div>
            <input type="email" id="email" placeholder="Email" value="himachal_tours@example.com">
            <input type="password" id="password" placeholder="Password" value="vendor123">
            <button onclick="testLogin()">Login</button>
        </div>
        <div id="loginResult"></div>
    </div>

    <div class="test-section">
        <h2>2. Test Dashboard Access</h2>
        <button onclick="testDashboard()">Test Dashboard</button>
        <div id="dashboardResult"></div>
    </div>

    <div class="test-section">
        <h2>3. Test Profile API</h2>
        <button onclick="testProfile()">Test Profile</button>
        <div id="profileResult"></div>
    </div>

    <div class="test-section">
        <h2>4. Test Trips API</h2>
        <button onclick="testTrips()">Test Trips</button>
        <div id="tripsResult"></div>
    </div>

    <script>
        let authToken = null;

        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('loginResult');

            try {
                const response = await fetch('http://localhost:5000/api/vendors/login', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'Origin': 'http://localhost:5173'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    authToken = data.token;
                    resultDiv.innerHTML = `<div class="success">✅ Login successful! Welcome ${data.user.name}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ Login failed: ${data.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        async function testDashboard() {
            const resultDiv = document.getElementById('dashboardResult');
            
            try {
                const response = await fetch('http://localhost:5173/vendor/dashboard', {
                    credentials: 'include'
                });

                if (response.ok) {
                    resultDiv.innerHTML = `<div class="success">✅ Dashboard accessible! Status: ${response.status}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ Dashboard not accessible: ${response.status}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        async function testProfile() {
            const resultDiv = document.getElementById('profileResult');
            
            if (!authToken) {
                resultDiv.innerHTML = `<div class="error">❌ Please login first</div>`;
                return;
            }

            try {
                const response = await fetch('http://localhost:5000/api/vendors/me', {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Origin': 'http://localhost:5173',
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<div class="success">✅ Profile retrieved! Business: ${data.data.businessName}, Rating: ${data.data.rating}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ Profile failed: ${data.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        async function testTrips() {
            const resultDiv = document.getElementById('tripsResult');
            
            if (!authToken) {
                resultDiv.innerHTML = `<div class="error">❌ Please login first</div>`;
                return;
            }

            try {
                const response = await fetch('http://localhost:5000/api/vendors/me/trips', {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Origin': 'http://localhost:5173',
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    const trips = data.trips || data.data || [];
                    resultDiv.innerHTML = `<div class="success">✅ Trips retrieved! Count: ${trips.length}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ Trips failed: ${data.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
